<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Reading both colors of a 384-well ratio assay</title><desc id="desc">A second detector halves the read time in the source comparison. Dark bars show the vendor’s fastest printed one-color read, or both colors at once where stated. Light bars show an estimated second pass for one-detector readers: an upper bound because plate movement is shared. Vendor settings differ (1 flash, sweep mode, “lowest setting”). Spark: Spark Cyto brochure ≤30 s for 384 wells. H1: kinetic figure, no flash count stated. Neo2’s 11 s is one color, and dual-emission time is not published; it reads two colors at once only on Dual Filter Top builds with a special-order cube.</desc><rect width="1200" height="1060" fill="#f6f3eb"/>
