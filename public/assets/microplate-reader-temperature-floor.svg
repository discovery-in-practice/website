<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Coldest setpoint in a 22 °C laboratory</title><desc id="desc">Every reader warms the plate above the room unless it can cool. Two can, one at the read position. Floors apply vendors’ “ambient +n °C” figures to a 22 °C lab. PHERAstar FSX AAS is optional and operates at 18–45 °C in the read chamber; detectors are cooled too. Spark Te-Cool is optional at the incubation position; the plate is read elsewhere. With Te-Cool fitted, room limit drops to 30 °C; at 30 °C and 50% RH the 18 °C floor is the dew point (calculated). Nexus: “The instrument cannot reach temperatures lower than the ambient temperature.” Alpha signal moves about 8% per °C (PerkinElmer); +4 °C shifts it by about a third (calculated). Tecan’s own note reports glow luminescence rising 34% in six minutes at +4 °C over ambient.</desc><rect width="1200" height="1060" fill="#f6f3eb"/>
<text x="32" y="37" fill="#505650" font-family="Arial, sans-serif" font-size="14" font-weight="400">DISCOVERY IN PRACTICE  /  MICROPLATE READERS</text>
