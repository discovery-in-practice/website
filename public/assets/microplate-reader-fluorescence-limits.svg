<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc"><title id="title">Fluorescein detection limits: printed and committed figures</title><desc id="desc">Top-read fluorescein detection limits, in pM on a logarithmic scale (lower is better). Light dots show brochure or data-sheet headlines; dark dots show the binding figure from the vendor’s own manual or guaranteed table. A single dark dot marks a single published “&lt;” limit. Sources: vendor brochures, data sheets and manuals as cited in the comparison matrix. Neo2 guarantee is provisional pending a newer manual. H1 guarantee is in 96-well; its data sheet is in 384-well. iD5 prints “optimized” and “guaranteed.” Varioskan prints amol per well with no volume.</desc><rect width="1200" height="1420" fill="#f6f3eb"/>
<text x="32" y="37" fill="#505650" font-family="Arial, sans-serif" font-size="14" font-weight="400">DISCOVERY IN PRACTICE  /  MICROPLATE READERS</text>
<text x="32" y="77" fill="#20211f" font-family="Arial, sans-serif" font-size="28" font-weight="700">Fluorescein detection limits: printed and committed figures</text>
<text x="32" y="123" fill="#505650" font-family="Arial, sans-serif" font-size="18" font-weight="400">The number printed, and the number the vendor commits to. A line connects the two figures; it does not represent uncertainty.</text>
