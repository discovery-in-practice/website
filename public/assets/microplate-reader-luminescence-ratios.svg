<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Luminescence: committed figure versus printed headline</title><desc id="desc">Shown as a ratio within each vendor’s own documents, because glow and flash figures cannot share one absolute axis. Light dot = headline (1×); dark dot = manual specification, guaranteed table or vendor measurement. Single “&lt;” limits are shown at 1×; missing or incompatible comparisons are not plotted. The original chart compares the same chemistry and plate. Spark source volumes differ: 55 µL in the brochure versus 100 µL in the Reference Guide. Spark glow values are 9 versus &lt;10 pM. Spark sources: ENLITEN flash ≤12 amol in 55 µL; Reference Guide 30124664 v2.2 (2024) §9.7.2. iD: live spec page versus Tables A-6/A-7. Nexus: spec sheet 947574 versus Revvity technical note (2025), Figure 1, Ultra-sensitive, same kit/plate/volume, 1 s. Neo2 manual specifies 10 s/well, 96-well, 200 µL.</desc><rect width="1200" height="1060" fill="#f6f3eb"/>
<text x="32" y="37" fill="#505650" font-family="Arial, sans-serif" font-size="14" font-weight="400">DISCOVERY IN PRACTICE  /  MICROPLATE READERS</text>
<text x="32" y="77" fill="#20211f" font-family="Arial, sans-serif" font-size="28" font-weight="700">Luminescence: committed figure versus printed headline</text>
<text x="32" y="123" fill="#505650" font-family="Arial, sans-serif" font-size="18" font-weight="400">Each reader is compared with its own headline. Ratios preserve the source chart’s figures and limits.</text>
